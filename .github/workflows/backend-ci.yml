name: Queryn backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product documentation
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-docs
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-docs

      - name: Checkout public specification
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-spec
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-spec

      - name: Checkout core types
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-core
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-core

      - name: Checkout extension SDK types
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-sdk
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-sdk

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Parse public JSON contracts
        working-directory: queryn-spec
        shell: bash
        run: node scripts/verify-contracts.mjs --core ../queryn-core --sdk ../queryn-sdk

      - name: Install documentation gate dependencies
        working-directory: queryn-spec
        run: pnpm install --frozen-lockfile

      - name: Install Mermaid browser
        working-directory: queryn-spec
        run: node node_modules/puppeteer/install.mjs

      - name: Install documentation dependencies
        working-directory: queryn-docs
        run: pnpm install --frozen-lockfile

      - name: Documentation checks
        working-directory: queryn-spec
        run: pnpm docs:check

      - name: Build normative documentation
        working-directory: queryn-docs
        run: |
          pnpm build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          path: queryn-runtime

      - name: Checkout public specification
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-spec
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-spec

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-core
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-core

      - name: Checkout extension SDK
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-sdk
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-sdk

      - name: Checkout extension examples
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-extensions
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-extensions

      - name: Checkout desktop bridge
        uses: actions/checkout@v4
        with:
          repository: Queryn-labs/queryn-desktop
          token: ${{ secrets.QUERYN_REPO_TOKEN || github.token }}
          path: queryn-desktop

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Specification tools
        working-directory: queryn-spec
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: pnpm install --frozen-lockfile

      - name: Core contracts
        working-directory: queryn-core
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          pnpm lint

      - name: Extension SDK
        working-directory: queryn-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

      - name: Runtime and headless CLI
        working-directory: queryn-runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm selftest
          pnpm typecheck

      - name: Reference extensions
        working-directory: queryn-extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm test:runtime

      - name: Desktop backend bridge
        working-directory: queryn-desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Comment hygiene
        working-directory: queryn-runtime
        shell: bash
        run: |
          for r in queryn-core queryn-sdk queryn-runtime queryn-desktop queryn-extensions; do
            node ../queryn-spec/scripts/check-comment-hygiene.mjs --check --repo "$r"
          done
